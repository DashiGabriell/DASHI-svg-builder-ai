[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-builder-ai"
version = "0.1.0"
description = "Professional AI-assisted image-to-SVG toolbox with modular layers and clean architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SVG Builder AI" }]
keywords = ["svg", "vectorization", "computer-vision", "openrouter", "customtkinter"]
dependencies = [
    "customtkinter>=5.2.2",
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=2.0.0",
    "scikit-image>=0.24.0",
    "svgwrite>=1.4.3",
    "cairosvg>=2.7.1",
    "shapely>=2.0.5",
    "potracer>=0.0.4",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
svg-builder-ai = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that touch external boundaries (mocked by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]
